services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ogtb
      POSTGRES_PASSWORD: ogtb
      POSTGRES_DB: ogtb_donation_map
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogtb -d ogtb_donation_map"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run prisma:generate && npm run db:deploy && npm run dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-4000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://ogtb:ogtb@db:5432/ogtb_donation_map?schema=public
      ROUTING_BASE_URL: ${ROUTING_BASE_URL:-https://router.project-osrm.org}
      DISABLE_AUTO_SELECT_FAMILY: ${DISABLE_AUTO_SELECT_FAMILY:-true}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-secret}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
      E2E_DISABLE_RATE_LIMIT: ${E2E_DISABLE_RATE_LIMIT:-false}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-}
      BACKEND_INTERNAL_URL: http://backend:${BACKEND_PORT:-4000}
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  frontend_next:
